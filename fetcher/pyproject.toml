[project]
name = "radar"
version = "0.1.0"
description = "Personal Job Radar: fetch, filter and score jobs from target companies"
requires-python = ">=3.12,<3.13"
dependencies = [
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "openpyxl>=3.1.5",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.1",
    "typer>=0.15",
    "rich>=13.9",
    "httpx>=0.28.1",
    "beautifulsoup4>=4.15.0",
    "playwright>=1.65.2",
    "groq>=1.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
radar = "radar.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # typer.Option(...) in defaults is the idiomatic Typer style

[tool.ruff.lint.per-file-ignores]
"src/radar/detect.py" = ["E501"]  # the ATS signature table reads best one row per line
"tests/fixtures/*" = ["E501"]     # fixture data
